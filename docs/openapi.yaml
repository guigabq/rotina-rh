  /times:
    post:
      operationId: createTimeRecord
      tags:
        - Registros de ponto
      summary: Adiciona um registro de ponto
      description: >
        Adiciona um registro por vez para o funcionário na data e hora passada.
        Este registro é armazenado como um registro com type='registro externo'.

         *IMPORTANTE:* Os registros de um funcionário mesmo que inseridos com
        sucesso por este endpoint, serão exibidos na interface do admin
        TiqueTaque apenas se o cadastro do  funcionário possuir uma escala e um
        empregador configurados. Depois de configurados os campos os registros 
        previamente adicionados serão exibidos também. <br>
         **Os campos `employee_id` e `employee_external_id` são mutuamente exclusivos no corpo da requisição.**
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  type: string
                employee_external_id:
                  type: string
                time:
                  $ref: '#/components/schemas/IsoDateTimeModel'
      responses:
        '200':
          description: OK
          content:
            applicaton/json:
              schema:
                type: object
                properties:
                  _status:
                    type: string
                    example: OK
                  employee:
                    type: string
                    example: fff5bc225b511a6edec2873ff
                  time:
                    $ref: '#/components/schemas/IsoDateTimeModel'
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '403':
          description: Sem permissão para realizar registros via API
          content:
            application/json:
              schema:
                type: object
                properties:
                  _code:
                    type: integer
                    example: 156
                  _error:
                    type: object
                    properties:
                      code:
                        type: integer
                        example: 403
                      message:
                        type: string
                        example: No permission for external records.
                      ui_message:
                        type: string
                        example: >-
                          Você não possui permissão para adicionar registros via
                          API.
                  status:
                    type: string
                    example: ERR
        '404':
          description: ID de funcionário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 56
                _error:
                  code: 404
                  message: resource not found.
                  ui_message: funcionário não encontrado.
                _status: ERR
        '422':
          description: >
            Erros de formato de dados de entrada. Os erros podem ser por motivos
            variados como falta de  algum dos parâmetros, ou formatos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '422':
                  $ref: '#/components/examples/422_example'
    get:
      operationId: getTimeRecords
      tags:
        - Registros de ponto
      summary: Registros de ponto
      description: >
        Retorna os detalhes dos registros para o funcionário solicitado, dentro
        do intervalo,

        o formato da resposta é o seguinte:


        ```

        {
            "employee_id": "5f5bc225b511a6e44c2891f6",
            "times": [
                {
                    "approved": true,
                    "justification": "Esqueci de registrar",
                    "time": "2024-09-25T07:32",
                    "type": "ajuste manual"
                },
                {
                    "approved": true,
                    "justification": "Registro via app com geolocalização",
                    "time": "2024-09-25T11:59",
                    "type": "app"
                }
            ]
        }

        ```


        | Chave         |
        Descrição                                                                          
        |

        |---------------|-------------------------------------------------------------------------------------|

        | employee      | ID do
        funcionário.                                                                 
        |

        | times         | Lista de registros de ponto encontrados para o
        funcionário.                         |


        Os valores para cada um dos itens da lista de `times` são:


        * `approved`: [true, false]. Indica se o registro já está aprovado pelo
        gestor.

        * `type`: [pré-assinalado, aparelho, web, desconsiderado, app,
        reconhecimento facial, ajuste manual, offline, registro externo]

        * `time`: Data e hora no format YYYY-MM-DDTHH:MM

        * `justification`: justificativa do registro, caso exista.
      parameters:
        - name: employee_id
          description: >-
            ID do funcionário. Obrigatório caso `employee_external_id` não
            esteja presente.
          required: false
          schema:
            type: string
          in: query
        - name: employee_external_id
          description: >-
            ID externo do funcionário. Obrigatório caso `employee_id` não esteja
            presente.
          required: false
          schema:
            type: string
          in: query
        - name: start_date
          description: Data inicial.
          required: true
          schema:
            $ref: '#/components/schemas/DateParamModel'
          in: query
        - name: end_date
          description: Data final.
          required: true
          schema:
            $ref: '#/components/schemas/DateParamModel'
          in: query
      responses:
        '200':
          description: >
            Resposta de sucesso, com detalhes dos registros de ponto. Os
            exemplos mostrams os valores de resposta possíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee_id:
                    description: >-
                      ID do funcionário. Obrigatório caso `employee_external_id`
                      não esteja presente.
                    type: string
                    example: 5f5bc225b511a6e44c2891f6
                  employee_external_id:
                    description: >-
                      ID externo do funcionário. Obrigatório caso `employee_id`
                      não esteja presente.
                    type: string
                  times:
                    description: Lista de registros de ponto.
                    type: array
                    items:
                      type: object
                      properties:
                        approved:
                          description: >-
                            Indica se o registro está aprovado ou pendente de
                            aprovação para fins de cálculos.
                          type: boolean
                        justification:
                          description: >-
                            Informações adicionais do motivo ou origem do
                            registro.
