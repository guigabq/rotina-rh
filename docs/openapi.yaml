                _status: ERR
    patch:
      operationId: updateUser
      tags:
        - Usuários
      summary: Atualiza um usuário
      description: |
        Atualiza um usuário específico.
      parameters:
        - name: id
          description: ID do usuário.
          required: true
          schema:
            type: string
          in: path
        - name: If-Match
          description: >
            Para atualizar um documento é necessário o header com o valor do
            campo `_etag` atual do documento.
          required: true
          schema:
            type: string
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPostModel'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  _created:
                    $ref: '#/components/schemas/IsoDateTimeTzModel'
                  _etag:
                    $ref: '#/components/schemas/EtagModel'
                  _status:
                    type: string
                    example: OK
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
