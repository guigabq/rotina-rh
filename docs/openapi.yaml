  /timesheets:
    get:
      operationId: getTimesheet
      tags:
        - Espelhos de ponto
      summary: Espelhos de ponto
      description: >
        Retorna espelhos de ponto com totais e detalhamento dia a dia.


        **Modos de operação:**


        - Com `employee_id` ou `employee_external_id`: retorna um único objeto
        de espelho para o funcionário informado.

        - Sem filtro de funcionário: retorna uma lista paginada de espelhos para
        todos os funcionários ativos que possuem
          espelho no período solicitado. Funcionários com cadastro incompleto são ignorados.
        - Informar `employee_id` e `employee_external_id` simultaneamente
        retorna erro.


        **Banco de horas e período parcial:** os dados de banco de horas —
        `banco_horas` em `totals` e `days`,

        e o objeto `hours_bank_summary` — só são calculados quando o período
        solicitado corresponde exatamente a

        uma folha de ponto completa do funcionário (do início ao fim do período
        de pagamento). Para um período

        parcial (qualquer intervalo diferente da folha, inclusive um recorte que
        começa no início dela ou que

        abrange mais de uma folha), o espelho é retornado normalmente com as
        demais rubricas, porém sem nenhum

        dado de banco de horas. No modo lista, funcionários cujo período de
        pagamento não coincide exatamente com

        o intervalo solicitado também são incluídos, sem os dados de banco de
        horas.


        As chaves possíveis em `totals` e `days` representam o total em horas
        centesimais de cada rubrica no período,

        e podem ser as seguintes:


        * total

        * horas_normais

        * banco_horas

        * falta_injustificada

        * falta_justificada

        * abono

        * folga

        * atraso

        * dsr

        * desconto_dsr

        * inss

        * atestado

        * dispensa_legal

        * adicional_noturno

        * adicional_noturno_extra_N (onde N é a faixa de horas extras em
        adicional noturno. e.g. adicional_noturno_extra_50)

        * hora_noturna_reduzida

        * afastamento_nao_remunerado

        * sobreaviso

        * suspensao

        * ferias

        * extra_N (onde N é a faixa de horas extras. e.g. extra_50)
      parameters:
        - name: employee_id
          description: >
            ID do funcionário. Opcional. Se informado, retorna apenas o espelho
            deste funcionário. Não pode ser usado em conjunto com
            `employee_external_id`.
          schema:
            type: string
          in: query
        - name: employee_external_id
          description: >
            ID externo do funcionário. Opcional. Se informado, retorna apenas o
            espelho deste funcionário. Não pode ser usado em conjunto com
            `employee_id`.
          schema:
            type: string
          in: query
        - name: start_date
          description: Data inicial da folha de ponto.
          required: true
          schema:
            $ref: '#/components/schemas/DateParamModel'
          in: query
        - name: end_date
          description: Data final da folha de ponto.
          required: true
          schema:
            $ref: '#/components/schemas/DateParamModel'
          in: query
        - name: max_results
          description: >
            Tamanho da página de resultados. Utilizado apenas quando nenhum
            filtro de funcionário é informado. O total reflete o número de
            funcionários com espelho no período, não o total de funcionários
            cadastrados.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/MaxResultsParamModel'
        - name: page
          description: >-
            Número da página de resultados. Utilizado apenas quando nenhum
            filtro de funcionário é informado.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/PageParamModel'
      responses:
        '200':
          description: >
            Resposta de sucesso. Quando `employee_id` ou `employee_external_id`
            é informado, retorna um único objeto de espelho. Quando nenhum
            filtro de funcionário é informado, retorna uma lista paginada de
            espelhos. Valores em horas centesimais.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TimesheetModel'
                  - title: Lista paginada
                    description: >-
                      Lista paginada de espelhos (quando nenhum filtro de
                      funcionário é informado).
                    type: object
                    properties:
                      _items:
                        type: array
                        description: >-
                          Lista de espelhos de ponto. Cada item possui a mesma
                          estrutura do retorno individual.
                        items:
                          $ref: '#/components/schemas/TimesheetModel'
                      _meta:
                        $ref: '#/components/schemas/MetaModel'
                      _links:
                        $ref: '#/components/schemas/LinksModel'
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '404':
          description: >
            Erro por funcionário não encontrado, ou por não existir espelho de
            ponto para o período solicitado (período fora do contrato do
            funcionário). Retornado apenas quando `employee_id` ou
            `employee_external_id` é informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                funcionario_nao_encontrado:
                  summary: Funcionário não encontrado.
                  value:
                    _code: 56
                    _error:
                      code: 404
                      message: funcionário not found.
                      ui_message: funcionário não encontrado.
                    _status: ERR
                periodo_sem_espelho:
                  summary: Período sem espelho de ponto para o funcionário.
                  value:
                    _code: 96
                    _error:
                      code: 404
                      message: No timesheet found for selected period.
                      ui_message: >-
                        Não existem espelhos de ponto para o período
                        selecionado.
                    _status: ERR
        '409':
          description: >
            Erro por cadastro de funcionário incompleto. Retornado apenas quando
            `employee_id` ou `employee_external_id` é informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 128
                _error:
                  code: 409
                  message: Incomplete employee profile.
                  ui_message: >-
                    Erro, cadastro de funcionário incompleto. Verifique com seu
                    gestor.
                _status: ERR
        '422':
          description: Erro por parâmetros incorretos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '422':
                  $ref: '#/components/examples/422_example'
