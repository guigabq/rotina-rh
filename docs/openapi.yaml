                $ref: '#/components/schemas/ErroRespostaModel'
        '422':
          description: Parâmetro obrigatório ausente ou com formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '422':
                  $ref: '#/components/examples/422_example'
    get:
      operationId: getPaymentSources
      tags:
        - Empregadores
      summary: Lista os empregadores
      description: >
        Lista todos empregadores ativos da conta. Pode ser filtrado por CNPJ
        e/ou CPF, útil para localizar empregadores criados na TiqueTaque que
        ainda não possuem `external_id`.
      parameters:
        - name: cnpj
          description: >
            Filtra empregadores pelo CNPJ, sem máscara. Aceita o formato
            numérico ou alfanumérico (12 caracteres alfanuméricos maiúsculos
            seguidos de 2 dígitos verificadores). Se enviado junto com `cpf`,
            retorna os empregadores que casam com qualquer um dos dois (OR).
          required: false
          in: query
          schema:
            type: string
            pattern: ^[0-9A-Z]{12}\d{2}$
            example: '23467093000164'
        - name: cpf
          description: >
            Filtra empregadores pelo CPF, apenas números, sem máscara. Se
            enviado junto com `cnpj`, retorna os empregadores que casam com
            qualquer um dos dois (OR).
          required: false
          in: query
          schema:
            type: string
            pattern: ^\d{11}$
            example: '01234567890'
        - name: max_results
          description: Tamanho da página de resultados paginados.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/MaxResultsParamModel'
        - name: page
          description: Número da página de resultados a retornar
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/PageParamModel'
      responses:
        '200':
          description: Lista de usuários.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentSourceModel'
                  _links:
                    $ref: '#/components/schemas/LinksModel'
                  _meta:
                    $ref: '#/components/schemas/MetaModel'
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '404':
          description: Erro empregador não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 56
                _error:
                  code: 404
                  message: empregador not found.
                  ui_message: empregador não encontrado.
                _status: ERR
        '422':
          description: Filtro `cnpj` ou `cpf` com formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 1403
                _error:
                  code: 422
                  message: Invalid format for cnpj.
                  ui_message: cnpj com formato inválido.
                _status: ERR
