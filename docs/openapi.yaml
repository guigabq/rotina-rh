      summary: Lista o cadastro dos funcionários ativos
      description: >
        Resultado paginado. A ausência de um campo na resposta indica que seu
        valor ainda não foi definido. Pode ser filtrado por empregador
        (`payment_source`), útil para localizar funcionários de um empregador
        específico que ainda não possuem `external_id`. Quando nenhum
        funcionário é encontrado, a resposta é 200 com `_items` vazio.
      parameters:
        - name: payment_source
          description: >
            Filtra os funcionários pelo `_id` do empregador (payment-source)
            vinculado. Deve ser um ObjectId válido.
          required: false
          in: query
          schema:
            type: string
            example: 5f3551beeb623e8ebe0ae994
        - name: max_results
          description: Tamanho da página de resultados paginados.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/MaxResultsParamModel'
        - name: page
          description: Número da página de resultados a retornar
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/PageParamModel'
      responses:
        '200':
          description: >
            Lista de funcionários. Quando nenhum funcionário atende à consulta,
            o retorno também é 200, com `_items` vazio e `_meta.total` igual a
            0.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeModel'
                  _links:
                    $ref: '#/components/schemas/LinksModel'
                  _meta:
                    $ref: '#/components/schemas/MetaModel'
              examples:
                lista_vazia:
                  summary: Nenhum funcionário encontrado
                  value:
                    _items: []
                    _links:
                      parent:
                        href: /
                        title: home
                    _meta:
                      max_results: 25
                      page: 1
                      total: 0
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '422':
          description: Filtro `payment_source` com formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 1403
                _error:
                  code: 422
                  message: Invalid format for payment_source.
                  ui_message: payment_source com formato inválido.
                _status: ERR
  /employees/bulk:
    post:
      operationId: createEmployeesBulk
      tags:
        - Funcionários
      summary: Cadastra funcionários em lote
      description: >
        Cria vários funcionários em uma única requisição (até 100), reduzindo o
        número de chamadas frente ao limite de 60 requisições por minuto. A
        operação é atômica: todos os itens são validados antes da criação e, se
        qualquer um falhar, nenhum funcionário é criado.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - employees
              properties:
                employees:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: >
                    Lista de funcionários a criar. Cada item segue o mesmo
                    formato do cadastro individual.
                  items:
                    $ref: '#/components/schemas/PostEmployeeModel'
      responses:
        '200':
          description: Todos os funcionários foram criados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        _created:
                          $ref: '#/components/schemas/IsoDateTimeTzModel'
                        _etag:
                          $ref: '#/components/schemas/EtagModel'
                        _status:
                          type: string
                          example: OK
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '422':
          description: >
            Lote com tamanho inválido (vazio ou acima de 100), ou um ou mais
            itens com erro de validação. Quando há erros de validação nenhum
            funcionário é criado e o campo `_issues` traz os erros de cada item
            que falhou, indexados pela posição do item na lista enviada e,
            dentro dela, pelo campo a que o erro se refere. Os mesmos erros
            também são descritos, em texto, nas mensagens de `_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroLoteRespostaModel'
              examples:
                tamanho_invalido:
                  summary: Lista vazia ou com mais de 100 itens
                  value:
                    _code: 1427
                    _error:
                      code: 422
                      message: >-
                        The 'employees' list must contain between 1 and 100
                        items.
                      ui_message: A lista 'employees' deve conter entre 1 e 100 itens.
                    _status: ERR
                itens_invalidos:
                  summary: >
                    Itens com erro de validação. No exemplo, o item da posição 0
                    é válido, o da posição 1 está sem `full_name` e com `state`
                    inválido, o da posição 2 tem `city` vazio, `birth_date` com
                    formato inválido e está sem
                    `contract_data.records_start_date`, e o da posição 3 informa
                    um `contract_data.payment_source` que não existe.
                  value:
                    _code: 157
                    _error:
                      code: 422
                      message: >-
                        Errors found for fields: {1: ['Campo full_name
                        obrigatório.', 'Campo state com valor inválido.'], 2:
                        ['Campo birth_date com formato inválido.', 'Campo city
                        não pode ser vazio.', 'Campo records_start_date
                        obrigatório.'], 3: ['Documento com id
                        aaaaaaaaaaaaaaaaaaaaaaaa não encontrado no recurso
                        payment_sources.']}
                      ui_message: >-
                        Os seguintes erros foram encontrados: {1: ['Campo
                        full_name obrigatório.', 'Campo state com valor
                        inválido.'], 2: ['Campo birth_date com formato
                        inválido.', 'Campo city não pode ser vazio.', 'Campo
                        records_start_date obrigatório.'], 3: ['Documento com id
                        aaaaaaaaaaaaaaaaaaaaaaaa não encontrado no recurso
                        payment_sources.']}
                    _status: ERR
                    _issues:
                      '1':
                        full_name: Campo obrigatório.
                        state: Campo com valor inválido.
                      '2':
                        birth_date: Campo com formato inválido.
                        city: Campo não pode ser vazio.
                        contract_data:
                          records_start_date: Campo obrigatório.
                      '3':
                        contract_data:
                          payment_source: >-
                            Documento com id aaaaaaaaaaaaaaaaaaaaaaaa não
                            encontrado no recurso payment_sources.
                item_nao_objeto:
                  summary: Item da lista que não é um objeto
                  value:
                    _code: 157
                    _error:
                      code: 422
                      message: >-
                        Errors found for fields: {2: ['Campo employees deve
                        conter objetos.']}
                      ui_message: >-
                        Os seguintes erros foram encontrados: {2: ['Campo
                        employees deve conter objetos.']}
                    _status: ERR
                    _issues:
                      '2':
                        employees: Campo employees deve conter objetos.
