  /work-leaves:
    post:
      operationId: createWorkLeave
      tags:
        - Afastamentos
      summary: Cria um afastamento para um funcionário
      requestBody:
        description: >
          O afastamento pode ser parcial ou de dia inteiro. Os valores
          `start_time` e `end_time` são opcionais, e devem ser preenchidos caso
          o afastamento seja parcial. Caso seja de dia inteiro, informar apenas
          `start_date` e `end_date`. Um dos valores entre `employee_id` e 
          `employee_external_id` é obrigatório e são mutuamente exclusivos.
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  description: >-
                    ID do funcionário. Obrigatório caso `employee_external_id`
                    não esteja presente.
                  type: string
                employee_external_id:
                  description: >-
                    ID externo do funcionário. Obrigatório caso `employee_id`
                    não esteja presente.
                  type: string
                type:
                  $ref: '#/components/schemas/TipoAfastamentoModel'
                start_date:
                  $ref: '#/components/schemas/DateParamModel'
                end_date:
                  $ref: '#/components/schemas/DateParamModel'
                start_time:
                  $ref: '#/components/schemas/TimeParamModel'
                end_time:
                  $ref: '#/components/schemas/TimeParamModel'
      responses:
        '200':
          description: Afastamento criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  _status:
                    type: string
                    example: OK
                  _created:
                    type: string
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '409':
          description: Erro de validação dos dados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
        '422':
          description: Erro por parâmetros incorretos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '422':
                  $ref: '#/components/examples/422_example'
    get:
      operationId: getWorkLeaves
      tags:
        - Afastamentos
      summary: Retorna uma lista com os afastamentos de um funcionário
      description: >
        Os afastamentos retornados, conforme os filtros aplicados são associados
        a um funcionário identificado por `employee_id`. Eles representam
        variados motivos que fazem com que o funcionário deixe de trabalhar o
        tempo previsto. Retorna todos os registros de afastamentos que contenham
        as  datas entre *start_date* e *end_date*. Resultado paginado
      parameters:
        - name: employee_id
          description: >-
            ID do funcionário. Obrigatório caso `employee_external_id` não
            esteja presente.
          schema:
            type: string
          in: query
        - name: employee_external_id
          description: >-
            ID externo do funcionário. Obrigatório caso `employee_id` não esteja
            presente.
          schema:
            type: string
          in: query
        - name: start_date
          description: |
            Filtro para data de início dos afastamentos.
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/DateParamModel'
        - name: end_date
          description: Filtro para data de fim dos afastamentos
          required: true
          in: query
          schema:
            $ref: '#/components/schemas/DateParamModel'
        - name: type
          description: filtro por tipo de afastamento.
          required: false
          schema:
            $ref: '#/components/schemas/TipoAfastamentoModel'
          in: query
        - name: status
          description: filtro por situação do afastamento.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/StatusAfastamentoModel'
        - name: max_results
          description: Tamanho da página de resultados paginados.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/MaxResultsParamModel'
        - name: page
          description: Número da página de resultados a retornar
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/PageParamModel'
      responses:
        '200':
          description: >-
            Retorna listagem de todos os afastamentos que atendem aos critérios
            dos filtros.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AfastamentoModel'
                  _links:
                    $ref: '#/components/schemas/LinksModel'
                  _meta:
                    $ref: '#/components/schemas/MetaModel'
        '404':
          description: Erro afastamento não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 56
                _error:
                  code: 404
                  message: afastamento not found.
                  ui_message: afastamento não encontrado.
                _status: ERR
        '422':
          description: Parâmetro obrigatório ausente ou com formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '422':
                  $ref: '#/components/examples/422_example'
