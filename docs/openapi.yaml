    ErroRespostaModel:
      description: Resposta de erro
      type: object
      properties:
        _code:
          description: Código de erro interno.
          type: integer
        _status:
          type: string
          example: ERR
        _error:
          type: object
          properties:
            code:
              description: Codigo de erro HTTP.
              type: integer
            message:
              description: Mensagem de erro interna.
              type: string
            ui_message:
              description: Mensagem de erro para o usuário.
              type: string
    ErroLoteRespostaModel:
      description: >
        Resposta de erro de uma requisição em lote. Além dos campos da resposta
        de erro padrão, traz o campo `_issues` com os erros de cada item que
        falhou.
      allOf:
        - $ref: '#/components/schemas/ErroRespostaModel'
        - type: object
          properties:
            _issues:
              description: >
                Erros de validação por item. Cada chave é a posição (índice,
                iniciando em 0) do item na lista enviada e apenas os itens com
                erro estão presentes. O valor é um objeto com os erros do item,
                indexados pelo campo a que se referem, seguindo a estrutura do
                corpo enviado (erros de campos aninhados, como os de
                `contract_data`, vêm aninhados). Erros que não pertencem a um
                campo, como um item que não é um objeto, são indexados por
                `employees`.
              type: object
              additionalProperties:
                type: object
                additionalProperties: true
              example:
                '1':
                  full_name: Campo obrigatório.
                  state: Campo com valor inválido.
                '2':
                  contract_data:
                    records_start_date: Campo obrigatório.
    AfastamentoModel:
      type: object
      properties:
        _id:
          description: ID do afastamento
          type: string
        _created:
          $ref: '#/components/schemas/IsoDateTimeTzModel'
        _updated:
          $ref: '#/components/schemas/IsoDateTimeTzModel'
        _etag:
          $ref: '#/components/schemas/EtagModel'
        employee_id:
          description: ID do funcionário
          type: string
        type:
          $ref: '#/components/schemas/TipoAfastamentoModel'
        end_date:
          type: string
          format: date
        start_date:
          type: string
          format: date
        approval_info:
          type: object
          properties:
            approved:
              type: boolean
              description: Indica se o afastamento foi aprovado.
            request_date:
              type: string
              description: Data em que o afastamento foi solicitado.
              example: '2020-05-05T08:28:14+00:00'
            change_request:
              type: object
              properties:
                approved_date:
                  type: string
                  description: Data em que o afastamento foi aprovado, caso tenha sido.
                  example: '2020-05-05T08:28:14+00:00'
                rejected_date:
                  type: string
                  description: Data em que o afastamento foi rejeitado, caso tenha sido.
                  example: '2020-05-05T08:28:14+00:00'
                rejected_by:
                  type: object
                  description: Dados existentes apenas quando o afastamento foi rejeitado.
                  properties:
                    id:
                      type: string
                      description: ID do usuário que rejeitou o afastamento.
                    name:
                      description: Nome do funcionário que rejeitou o afastamento.
                      type: string
                approved_by:
                  type: object
                  description: Dados existentes apenas quando o afastamento foi aprovado.
                  properties:
                    id:
                      type: string
                      description: ID do usuário que aprovou o afastamento.
                    name:
                      description: Nome do funcionário que aprovou o afastamento.
                      type: string
    LinksModel:
      type: object
      properties:
        parent:
          type: object
          properties:
            href:
              type: string
            title:
              type: string
        self:
          type: object
          properties:
            href:
              type: string
            title:
              type: string
    MetaModel:
      type: object
      properties:
        max_results:
          type: integer
        page:
          type: integer
        total:
          type: integer
    TipoAfastamentoModel:
      type: string
      enum:
        - abono
        - afastamento
        - atestado
        - dispensa_legal
        - falta_justificada
        - falta_injustificada
        - ferias
        - folga
        - inss
        - suspensao
    StatusAfastamentoModel:
      type: string
      enum:
        - aprovado
        - pendente
        - reprovado
    DateParamModel:
      type: string
      format: date
      example: '2023-09-27'
    TimeParamModel:
      type: string
      example: HH:MM
    MaxResultsParamModel:
      type: integer
      description: Tamanho da página dos resultados, valor padrão 25.
      default: 25
    PageParamModel:
      type: integer
      description: Número da página de resultados solicitada.
      default: 1
  examples:
    401_example:
      value:
        _code: 9
        _error:
          code: 401
          message: Invalid account credentials.
          ui_message: Credenciais inválidas
        _status: ERR
    422_example:
      value:
        _code: 1300
        _error:
          code: 422
          message: Missing 'p1' query parameter.
          ui_message: Falta o parâmetro 'p1' na requisição.
        _status: ERR
paths:
  /work-schedules/summary:
    get:
      operationId: getWorkSchedulesSummary
      tags:
        - Escalas
      summary: Lista com sumário de escalas de trabalho
      description: >-
        Retorna a listagem paginada de nomes de escalas de trabalho ativas e
        visíveis, com o correspondente ID.
      parameters:
        - name: max_results
          description: Tamanho da página de resultados paginados.
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/MaxResultsParamModel'
        - name: page
          description: Número da página de resultados a retornar
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/PageParamModel'
      responses:
        '200':
          description: Lista de usuários.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkScheduleSummaryModel'
                  _links:
                    $ref: '#/components/schemas/LinksModel'
                  _meta:
                    $ref: '#/components/schemas/MetaModel'
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '404':
          description: Erro usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              example:
                _code: 56
                _error:
                  code: 404
                  message: usuário not found.
                  ui_message: usuário não encontrado.
                _status: ERR
  /users:
    post:
      operationId: createUser
      tags:
        - Usuários
      summary: Cria um novo usuário
      description: |
        Cria um novo usuário.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPostModel'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  _created:
                    $ref: '#/components/schemas/IsoDateTimeTzModel'
                  _etag:
                    $ref: '#/components/schemas/EtagModel'
                  _status:
                    type: string
                    example: OK
        '401':
          description: Erro por credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '401':
                  $ref: '#/components/examples/401_example'
        '409':
          description: Erro de validação dos dados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
        '422':
          description: Parâmetro obrigatório ausente ou com formato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroRespostaModel'
              examples:
                '422':
                  $ref: '#/components/examples/422_example'
    get:
